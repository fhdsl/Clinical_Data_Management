  favicon: assets/ITN_favicon.ico
  bread-crumbs: false

  page-navigation: true
  search: true
  repo-url: https://hutchdatascience.org/Clinical_Data_Management/
  repo-actions: [edit]
  issue-url: https://docs.google.com/forms/d/e/1FAIpQLSeYwgP9ZKGRCCkLV2vnMZy9ZLSqXZTUKTFKDVYEy95aXzw2Bg/viewform
  google-analytics: "G-931MJ5476Z"

  chapters:
    - index.qmd
    - intro.qmd
    - data_types.qmd
    - multimodal.qmd
    - study_design.qmd
    - data_acquisition.qmd
    - data_uses.qmd
    - data_management.qmd
    - about.qmd
